<form class="enquiry-form" id="enquiry-form" novalidate>
  <div class="field-row">
    <div class="field">
      <label for="eq-name">Your name <span aria-hidden="true">*</span></label>
      <input id="eq-name" name="name" type="text" autocomplete="name" required>
    </div>
    <div class="field">
      <label for="eq-phone">Phone number <span aria-hidden="true">*</span></label>
      <input id="eq-phone" name="phone" type="tel" autocomplete="tel" required>
    </div>
  </div>
  <div class="field-row">
    <div class="field">
      <label for="eq-service">Type of service <span aria-hidden="true">*</span></label>
      <select id="eq-service" name="service" required>
        <option value="">Choose one</option>
        <option value="wedding">Wedding</option>
        <option value="funeral">Funeral</option>
        <option value="memorial">Memorial service</option>
        <option value="church">Church service or deputy cover</option>
        <option value="concert">Concert, recital or accompaniment</option>
        <option value="other">Something else</option>
      </select>
    </div>
    <div class="field">
      <label for="eq-date">Date <span aria-hidden="true">*</span></label>
      <input id="eq-date" name="date" type="date" required>
    </div>
  </div>
  <div class="field-row">
    <div class="field">
      <label for="eq-time">Start time</label>
      <input id="eq-time" name="time" type="time">
    </div>
    <div class="field">
      <label for="eq-venue">Venue and town <span aria-hidden="true">*</span></label>
      <input id="eq-venue" name="venue" type="text" placeholder="e.g. St Peter's, Burnley" required>
    </div>
  </div>
  <div class="field">
    <label for="eq-email">Email <span class="optional">(optional)</span></label>
    <input id="eq-email" name="email" type="email" autocomplete="email">
  </div>
  <div class="field">
    <label for="eq-message">Music or other details</label>
    <textarea id="eq-message" name="message" rows="4" placeholder="Hymns, pieces you'd like, funeral director, anything else I should know"></textarea>
  </div>
  <div class="hp" aria-hidden="true"><label for="eq-website">Leave this empty</label><input id="eq-website" name="website" type="text" tabindex="-1" autocomplete="off"></div>
  <p class="form-status" role="status" aria-live="polite" hidden></p>
  <div class="form-actions">
    <button class="btn btn--wa" type="submit" value="whatsapp">Send on WhatsApp</button>
    <button class="btn btn--ghost" type="submit" value="email">Send enquiry</button>
  </div>
  <p class="form-note">Either button sends your enquiry to Jay. "Send on WhatsApp" also opens a ready-written WhatsApp message if you'd like to chat there. Sending an enquiry doesn't commit you to anything — see the <a href="/privacy-policy/">privacy policy</a>.</p>
  <noscript><p class="form-note">This form needs JavaScript. Please WhatsApp or call {{phone}}, or email {{email}}.</p></noscript>
</form>
